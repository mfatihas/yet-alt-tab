name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # CGWindowListCreateImage (previews) is obsoleted in the macOS 15 SDK.
      - name: Pin Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Build
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Bundle
        run: |
          APP=BiscuitTab.app
          mkdir -p $APP/Contents/MacOS
          cp .build/apple/Products/Release/BiscuitTab $APP/Contents/MacOS/
          cat > $APP/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>BiscuitTab</string>
            <key>CFBundleIdentifier</key><string>com.mfatihas.biscuittab</string>
            <key>CFBundleName</key><string>BiscuitTab</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>LSUIElement</key><true/>
          </dict></plist>
          EOF

      # Free signing: ad-hoc (no Apple Developer account). Gatekeeper will ask for right-click > Open once.
      - name: Sign (ad-hoc)
        run: |
          codesign --force --deep --sign - BiscuitTab.app
          codesign --verify --verbose BiscuitTab.app

      - name: Zip
        run: ditto -c -k --keepParent BiscuitTab.app BiscuitTab.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BiscuitTab
          path: BiscuitTab.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" BiscuitTab.zip --generate-notes
