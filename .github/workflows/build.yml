name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # CGWindowListCreateImage (previews) is obsoleted in the macOS 15 SDK.
      - name: Pin Xcode 15.4
        run: "[ -d /Applications/Xcode_15.4.app ] && sudo xcode-select -s /Applications/Xcode_15.4.app || true"

      - name: Build
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Bundle
        run: |
          APP=YetAltTab.app
          mkdir -p $APP/Contents/MacOS
          cp .build/apple/Products/Release/YetAltTab $APP/Contents/MacOS/
          cat > $APP/Contents/Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>YetAltTab</string>
            <key>CFBundleIdentifier</key><string>com.mfatihas.yetalttab</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundleName</key><string>YetAltTab</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>__VERSION__</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>LSUIElement</key><true/>
          </dict></plist>
          EOF
          VER=0.0.0; case "$GITHUB_REF_NAME" in v*) VER=${GITHUB_REF_NAME#v};; esac
          sed -i '' "s/__VERSION__/$VER/" $APP/Contents/Info.plist

      - name: Icon
        run: |
          I=AppIcon.iconset; mkdir $I
          for n in 16 32 128 256 512; do
            sips -z $n $n assets/icon.png --out $I/icon_${n}x${n}.png >/dev/null
            sips -z $((n*2)) $((n*2)) assets/icon.png --out $I/icon_${n}x${n}@2x.png >/dev/null
          done
          mkdir -p YetAltTab.app/Contents/Resources
          iconutil -c icns $I -o YetAltTab.app/Contents/Resources/AppIcon.icns

      # Optional stable identity: a self-signed cert (secrets SIGN_CERT_P12 base64 + SIGN_CERT_PASSWORD) keeps the code
      # requirement identical across builds, so macOS keeps Accessibility / Screen Recording grants after updates.
      # Without the secrets the build falls back to ad-hoc, whose identity changes every build.
      - name: Import signing cert
        env:
          CERT_P12: ${{ secrets.SIGN_CERT_P12 }}
          CERT_PASS: ${{ secrets.SIGN_CERT_PASSWORD }}
        run: |
          [ -z "$CERT_P12" ] && exit 0
          echo "$CERT_P12" | base64 -d > cert.p12
          security create-keychain -p ci build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain >/dev/null
          security list-keychains -d user -s build.keychain login.keychain
          echo "SIGN_ID=$(security find-identity -p codesigning build.keychain | awk '/[0-9A-F]{40}/{print $2; exit}')" >> $GITHUB_ENV
          rm cert.p12

      - name: Sign
        run: |
          codesign --force --deep --sign "${SIGN_ID:--}" YetAltTab.app
          codesign -dvv YetAltTab.app 2>&1 | grep -e Authority -e Signature -e Identifier
          codesign --verify --verbose YetAltTab.app

      # Drag-to-Applications window: app icon on the left, Applications link on the right, arrow background.
      - name: DMG
        run: |
          brew install create-dmg
          mkdir stage && cp -R YetAltTab.app stage/
          create-dmg --volname YetAltTab --volicon YetAltTab.app/Contents/Resources/AppIcon.icns \
            --background assets/dmg-bg.png --window-pos 200 120 --window-size 600 400 --icon-size 100 \
            --icon YetAltTab.app 150 190 --hide-extension YetAltTab.app --app-drop-link 450 190 \
            YetAltTab.dmg stage \
          || { echo "create-dmg failed, using plain DMG"; rm -f YetAltTab.dmg; ln -s /Applications stage/Applications;
               hdiutil create -volname YetAltTab -srcfolder stage -ov -format UDZO YetAltTab.dmg; }
          codesign --force --sign "${SIGN_ID:--}" YetAltTab.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: YetAltTab
          path: YetAltTab.dmg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" YetAltTab.dmg --generate-notes
